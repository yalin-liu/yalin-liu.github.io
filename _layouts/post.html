---
layout: default
---
<article class="post h-entry content-wrapper" lang="{{ page.language | default: 'en' | replace: '_', '-' }}">
  <header class="post-header">
    <h1 class="post-title p-name">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">
        {% if page.language == "en" %}{{ page.date | date: "%b %-d, %Y" }}{% else %}{{ page.date | date: "%Y年%-m月%-d日" }}{% endif %}
      </time>
    </p>
  </header>
  <div class="post-content e-content">{{ content }}</div>
</article>
